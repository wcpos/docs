name: IndexNow

# After a successful Vercel PRODUCTION deploy, tell IndexNow engines (Bing/Copilot,
# ...) which 1.x docs pages changed so they re-crawl instead of serving stale URLs.
# Runs after the deploy is live, so it cannot block it; the script exits 0 on errors.

on: deployment_status

permissions:
  contents: read

jobs:
  ping:
    # Vercel names the environment "Production"; expression `==` ignores case.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit Vercel deployed, not whatever main points at by the time
          # this job runs.
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'

      # Every merge to main lands as a single commit (squash or merge), so
      # HEAD~1..HEAD is the deployed change set. A redeploy of the same commit
      # just re-sends the same URLs, which is harmless.
      - name: Ping IndexNow with changed pages
        run: |
          git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- \
            'versioned_docs/version-1.x/**' \
            'i18n/*/docusaurus-plugin-content-docs/version-1.x/**' \
            | node scripts/indexnow-ping.js
