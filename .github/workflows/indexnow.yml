name: IndexNow

# After a successful Vercel PRODUCTION deploy, tell IndexNow engines (Bing/Copilot,
# ...) which 1.x docs pages changed so they re-crawl instead of serving stale URLs.
# Runs after the deploy is live, so it cannot block it; the script exits 0 on errors.

on: deployment_status

permissions:
  contents: read
  deployments: read

jobs:
  ping:
    # Vercel names the environment "Production"; expression `==` ignores case.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit Vercel deployed, not whatever main points at by the time
          # this job runs.
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'

      # Vercel builds production one commit at a time and cancels builds that a
      # newer push supersedes, so several merges can land as ONE deployment.
      # The change set is therefore everything since the last commit that was
      # actually deployed, not HEAD~1. Falls back to HEAD~1 on the first run.
      - name: Find the previously deployed commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
        run: |
          base=""
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=30" \
              --jq ".[] | select(.id < ${DEPLOYMENT_ID}) | .id"); do
            # Any "success" status means the commit went live; a later "inactive"
            # only means a newer deployment replaced it. Cancelled builds never
            # get a "success".
            if gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '[.[] | select(.state == "success")] | length' | grep -qvx 0; then
              base=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq .sha)
              break
            fi
          done
          if [ -z "$base" ]; then
            echo "No earlier successful production deployment found; diffing against the parent commit."
            base=$(git rev-parse HEAD~1)
          else
            echo "Previous production deployment: ${base}"
            git fetch --no-tags --depth=1 origin "$base"
          fi
          echo "sha=${base}" >> "$GITHUB_OUTPUT"

      # A redeploy of the same commit yields an empty diff, which sends nothing.
      - name: Ping IndexNow with changed pages
        run: |
          git diff --name-only --diff-filter=ACMR "${{ steps.base.outputs.sha }}" HEAD -- \
            'versioned_docs/version-1.x/**' \
            'i18n/*/docusaurus-plugin-content-docs/version-1.x/**' \
            | node scripts/indexnow-ping.js
